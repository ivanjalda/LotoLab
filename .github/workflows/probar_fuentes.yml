name: Probar fuentes oficiales
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/probar_fuentes.py
      - name: Guardar resultado
        run: |
          git config user.name "lotolab-bot"
          git config user.email "lotolab-bot@users.noreply.github.com"
          git add data/pruebas_fuentes.json
          git diff --cached --quiet || git commit -m "Prueba de fuentes oficiales"
          git pull --rebase
          git push
