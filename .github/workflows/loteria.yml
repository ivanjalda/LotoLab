name: Actualizar datos LotoLab

on:
  workflow_dispatch:
  schedule:
    - cron: "17 1,7,13,19 * * *"

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Descargar datos y calcular estadisticas
        run: python scripts/loteria_engine.py

      - name: Calcular combinaciones sugeridas y historial
        continue-on-error: true
        run: python scripts/sugerencias.py

      - name: Datos de España (varias fuentes, aprende solo)
        continue-on-error: true
        run: python scripts/espana.py

      - name: Guardar botes (premio gordo y ganadores)
        continue-on-error: true
        run: python scripts/botes.py

      - name: Guardar cambios
        run: |
          git config user.name "lotolab-bot"
          git config user.email "lotolab-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Sin cambios que guardar"
          else
            git commit -m "Actualizar datos de loterias"
            git pull --rebase
            git push
          fi
