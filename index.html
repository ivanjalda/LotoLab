<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LotoLab</title>
<meta name="description" content="Estadística de loterías de España y EE. UU. con datos reales / Lottery statistics for Spain and the USA with real data.">
<style>
  :root {
    --bg:#f5f7f5; --panel:#ffffff; --line:#e1e7e2; --text:#13201a; --muted:#5a6b61;
    --green:#177a43; --green-soft:#e6f4ec; --on-green:#ffffff; --gold:#c99a1b; --red:#d9455a;
    --ball-bg:#ffffff; --ball-fg:#13201a; --ball-line:#c9d3cc;
    --warn-bg:#fff6df; --warn-line:#e0b233; --warn-fg:#6b5310; --shadow:0 1px 3px rgba(16,32,24,.08);
  }
  [data-theme="dark"] {
    --bg:#0c1410; --panel:#14201a; --line:#243529; --text:#e7f0e9; --muted:#9bb0a3;
    --green:#3fcf8e; --green-soft:#12301f; --on-green:#062014; --gold:#e8b94a; --red:#ff6b7d;
    --ball-bg:#e7f0e9; --ball-fg:#0c1410; --ball-line:#e7f0e9;
    --warn-bg:#2a2410; --warn-line:#a98a2a; --warn-fg:#f0dc9a; --shadow:none;
  }
  * { box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:Arial,Helvetica,sans-serif; line-height:1.5; }
  a { color:inherit; }

  /* Cabecera */
  header { position:sticky; top:0; z-index:20; background:var(--panel); border-bottom:1px solid var(--line); box-shadow:var(--shadow); }
  .top { padding:10px 20px; display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  .logo { display:flex; align-items:center; gap:9px; font-size:1.45rem; font-weight:bold; text-decoration:none; color:var(--text); }
  .logo i { width:34px; height:34px; border-radius:9px; background:var(--green); color:var(--on-green); display:inline-flex; align-items:center; justify-content:center; font-style:normal; font-size:1.05rem; }
  .logo span { color:var(--green); }
  .actions { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .btn { display:inline-flex; align-items:center; gap:6px; background:var(--green); color:var(--on-green); border:1px solid var(--green); border-radius:10px; padding:8px 14px; font-size:.9rem; font-weight:bold; cursor:pointer; text-decoration:none; font-family:inherit; }
  .btn.alt { background:var(--panel); color:var(--text); border-color:var(--line); }
  .btn.disabled { background:var(--panel); color:var(--muted); border-color:var(--line); cursor:default; }
  .iconbtn { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:7px 11px; cursor:pointer; font-size:1rem; color:var(--text); }
  .lang { display:flex; }
  .lang button { background:var(--panel); color:var(--muted); border:1px solid var(--line); padding:8px 12px; cursor:pointer; font-size:.88rem; font-weight:bold; }
  .lang button:first-child { border-radius:10px 0 0 10px; }
  .lang button:last-child { border-radius:0 10px 10px 0; border-left:none; }
  .lang button.on { background:var(--gold); color:#1d1500; border-color:var(--gold); }
  .menu { padding:0 20px 10px; display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; }
  .menu::-webkit-scrollbar { display:none; }
  .menu button { background:transparent; color:var(--muted); border:none; border-bottom:3px solid transparent; padding:8px 12px; cursor:pointer; white-space:nowrap; font-size:.92rem; font-weight:bold; font-family:inherit; }
  .menu button.on { color:var(--green); border-bottom-color:var(--green); }

  /* Estructura a pantalla completa */
  .page { display:grid; grid-template-columns:minmax(0,1fr); gap:20px; padding:20px 20px 10px; }
  .rail { display:none; }
  @media (min-width:1100px) {
    .page { grid-template-columns:clamp(220px,15vw,340px) minmax(0,1fr) clamp(220px,15vw,340px); }
    .rail { display:flex; flex-direction:column; gap:12px; position:sticky; top:120px; align-self:start;
            max-height:calc(100vh - 135px); overflow-y:auto; scrollbar-width:none; }
    .rail::-webkit-scrollbar { display:none; }
    .mix { grid-template-columns:repeat(6,1fr) !important; }
  }
  h1 { font-size:2.1rem; margin:0 0 8px; line-height:1.2; }
  h1 .hl { color:var(--green); }
  h2 { font-size:1.1rem; margin:30px 0 10px; text-transform:uppercase; letter-spacing:.04em; color:var(--gold); }
  h3 { font-size:1.02rem; margin:18px 0 6px; }
  .sub { color:var(--muted); margin:0 0 20px; max-width:900px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:14px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:18px; color:var(--text); text-align:left; font:inherit; box-shadow:var(--shadow); }
  button.card { cursor:pointer; width:100%; }
  button.card:hover { border-color:var(--green); }
  .card h3 { margin:0 0 6px; font-size:1.1rem; }
  .card p { margin:4px 0; color:var(--muted); font-size:.92rem; }
  .card h2 { margin-top:0; }
  .tag { display:inline-block; font-size:.72rem; font-weight:bold; color:var(--on-green); background:var(--green); border-radius:10px; padding:2px 9px; margin-bottom:8px; }
  .soon { color:var(--green); font-weight:bold; font-size:.85rem; }
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:14px; margin:18px 0; }
  .stat b { display:block; font-size:1.7rem; }
  .stat span { color:var(--muted); font-size:.9rem; }
  .notice { background:var(--green-soft); border-left:4px solid var(--green); padding:14px 16px; border-radius:8px; color:var(--text); font-size:.9rem; margin-top:26px; }
  .warn { background:var(--warn-bg); border-left:4px solid var(--warn-line); padding:12px 16px; border-radius:8px; color:var(--warn-fg); font-size:.9rem; margin:12px 0; }
  .note { color:var(--muted); font-size:.85rem; margin:0 0 10px; }
  .view { display:none; }
  .view.on { display:block; }
  .back { background:none; border:none; color:var(--green); cursor:pointer; font-size:.95rem; font-weight:bold; padding:0; margin-bottom:14px; font-family:inherit; }

  /* Bolas y barras */
  .ball { display:inline-flex; width:34px; height:34px; border-radius:50%; align-items:center; justify-content:center; font-weight:bold; font-size:.88rem; background:var(--ball-bg); color:var(--ball-fg); border:2px solid var(--ball-line); margin:2px; }
  .ball.b { background:var(--red); border-color:var(--red); color:#fff; }
  .ball.hit { box-shadow:0 0 0 3px var(--green); }
  .drow { display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; padding:8px 0; border-bottom:1px solid var(--line); }
  .drow:last-child { border-bottom:none; }
  .drow .d { color:var(--muted); font-size:.88rem; min-width:110px; }
  .row { display:flex; align-items:center; gap:10px; margin:7px 0; }
  .row .n { width:30px; text-align:right; font-weight:bold; flex:none; }
  .row .lab { width:150px; flex:none; font-size:.9rem; }
  .track { position:relative; flex:1; height:14px; background:var(--line); border-radius:7px; }
  .fill { height:100%; background:var(--green); border-radius:7px; }
  .mark { position:absolute; top:-3px; bottom:-3px; width:2px; background:var(--gold); }
  .val { width:96px; text-align:right; font-size:.82rem; color:var(--muted); flex:none; }
  .loading { color:var(--muted); padding:20px 0; }

  /* Comprobador */
  .form label { display:block; font-weight:bold; font-size:.9rem; margin:14px 0 6px; }
  .form select, .form input { background:var(--bg); color:var(--text); border:1px solid var(--line); border-radius:10px; padding:10px 12px; font-size:1rem; font-family:inherit; }
  .form select { width:100%; max-width:420px; }
  .nums { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .nums input { width:64px; text-align:center; font-weight:bold; }
  .nums input.bonus { border-color:var(--red); }
  .result { margin-top:16px; }
  .result.win { border-color:var(--green); }
  .result h3 { font-size:1.25rem; margin-top:0; }

  /* Noticias y publicidad mezcladas */
  .fcard { display:block; text-decoration:none; background:var(--panel); border:1px solid var(--line); border-radius:12px; overflow:hidden; box-shadow:var(--shadow); flex:none; }
  .fcard:hover { border-color:var(--green); }
  .fimg { display:flex; align-items:center; justify-content:center; width:100%; height:110px; object-fit:cover; font-size:2.4rem; background:linear-gradient(135deg,var(--green),#0e4d2a); color:#fff; }
  .fb { padding:10px 12px 12px; }
  .badge { display:inline-block; font-size:.68rem; font-weight:bold; text-transform:uppercase; letter-spacing:.05em; border-radius:6px; padding:1px 7px; margin-bottom:5px; background:var(--green-soft); color:var(--green); }
  .badge.ad { background:var(--warn-bg); color:var(--warn-fg); }
  .fb b { display:block; font-size:.92rem; line-height:1.3; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .fb small { display:block; color:var(--muted); font-size:.78rem; margin-top:4px; }
  .fb em { color:var(--green); font-style:normal; font-weight:bold; font-size:.8rem; }
  .mix { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; }
  .bottom { padding:10px 20px; }
  .tgband { margin:10px 0 0; padding:0 20px; }
  .tgbox { background:var(--green); color:var(--on-green); border-radius:16px; padding:22px; display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; }
  .tgbox h3 { margin:0 0 4px; font-size:1.25rem; }
  .tgbox p { margin:0; max-width:640px; font-size:.95rem; }
  .tgbox .btns { display:flex; gap:8px; flex-wrap:wrap; }
  .tgbox .btn { background:var(--on-green); color:var(--green); border-color:var(--on-green); }
  .tgbox .btn.disabled { background:transparent; color:var(--on-green); border-color:var(--on-green); opacity:.85; }
  .banner { height:120px; border-radius:12px; background:linear-gradient(135deg,var(--green),#0e4d2a); display:flex; align-items:center; justify-content:center; font-size:3rem; margin-bottom:12px; }
  footer { border-top:1px solid var(--line); text-align:center; padding:22px 16px; color:var(--muted); font-size:.82rem; margin-top:14px; }
  #rev { margin-top:4px; }

  @media (max-width:520px) {
    h1 { font-size:1.6rem; }
    .row .lab { width:110px; font-size:.82rem; }
    .val { width:78px; font-size:.78rem; }
    .top { padding:8px 12px; }
    .menu, .page, .bottom, .tgband { padding-left:12px; padding-right:12px; }
    .logo { font-size:1.25rem; }
  }
</style>
</head>
<body>

<header>
  <div class="top">
    <a class="logo" href="#" onclick="show('home');return false;"><i>L</i><div>Loto<span>Lab</span></div></a>
    <div class="actions">
      <a class="btn" id="tg-top" data-tg="auto"></a>
      <button class="btn alt" data-view="subs" data-i18n="subs_btn"></button>
      <button class="iconbtn" id="theme-btn" title="Modo día / noche" aria-label="Modo día / noche"></button>
      <div class="lang"><button id="btn-es" onclick="setLang('es')">ES</button><button id="btn-en" onclick="setLang('en')">EN</button></div>
    </div>
  </div>
  <nav class="menu">
    <button data-view="home"    data-i18n="nav_home"></button>
    <button data-view="es"      data-i18n="nav_es"></button>
    <button data-view="us"      data-i18n="nav_us"></button>
    <button data-view="check"   data-i18n="nav_check"></button>
    <button data-view="winners" data-i18n="nav_winners"></button>
    <button data-view="news"    data-i18n="nav_news"></button>
    <button data-view="guide"   data-i18n="nav_guide"></button>
    <button data-view="legal"   data-i18n="nav_legal"></button>
  </nav>
</header>

<div class="page">
  <aside class="rail" id="rail-left"></aside>

  <main>
    <section id="v-home" class="view">
      <h1 data-i18n="home_title"></h1>
      <p class="sub" data-i18n="home_sub"></p>
      <div id="home-stats" class="stats"></div>
      <h2 data-i18n="latest_title"></h2>
      <div id="home-latest" class="grid"></div>
      <h2 data-i18n="news_latest"></h2>
      <div id="home-news" class="mix"></div>
      <h2 data-i18n="what_title"></h2>
      <div class="grid">
        <div class="card"><h3 data-i18n="home_c1_t"></h3><p data-i18n="home_c1_p"></p></div>
        <div class="card"><h3 data-i18n="home_c2_t"></h3><p data-i18n="home_c2_p"></p></div>
        <div class="card"><h3 data-i18n="home_c3_t"></h3><p data-i18n="home_c3_p"></p></div>
        <button class="card" data-view="check"><h3 data-i18n="home_c4_t"></h3><p data-i18n="home_c4_p"></p><p class="soon" data-i18n="home_c4_go"></p></button>
      </div>
      <div class="notice" data-i18n="disclaimer"></div>
    </section>

    <section id="v-es" class="view">
      <h1 data-i18n="es_title"></h1>
      <p class="sub" data-i18n="es_sub"></p>
      <div id="list-es" class="grid"></div>
      <h2 data-i18n="qn_h"></h2>
      <div class="card">
        <div class="banner">⚽</div>
        <h3 data-i18n="qn_title"></h3>
        <p data-i18n="qn_text"></p>
        <p><a class="btn" href="https://sportevlab.com/" target="_blank" rel="noopener" data-i18n="qn_btn"></a></p>
      </div>
    </section>

    <section id="v-us" class="view">
      <h1 data-i18n="us_title"></h1>
      <p class="sub" data-i18n="us_sub"></p>
      <div id="list-us" class="grid"></div>
    </section>

    <section id="v-lot" class="view">
      <button class="back" id="lot-back" data-i18n="back"></button>
      <div id="lot-body"></div>
    </section>

    <section id="v-check" class="view">
      <h1 data-i18n="check_title"></h1>
      <p class="sub" data-i18n="check_sub"></p>
      <div class="card form" id="ck-form"></div>
      <div id="ck-result"></div>
    </section>

    <section id="v-winners" class="view">
      <h1 data-i18n="winners_title"></h1>
      <p class="sub" data-i18n="winners_sub"></p>
      <div id="winners-list" class="mix"></div>
    </section>

    <section id="v-news" class="view">
      <h1 data-i18n="news_title"></h1>
      <p class="sub" data-i18n="news_sub"></p>
      <div id="news-list" class="mix"></div>
    </section>

    <section id="v-guide" class="view">
      <h1 data-i18n="guide_title"></h1>
      <p class="sub" data-i18n="guide_sub"></p>
      <div class="grid">
        <div class="card"><h3 data-i18n="g1"></h3><p class="soon" data-i18n="soon"></p></div>
        <div class="card"><h3 data-i18n="g2"></h3><p class="soon" data-i18n="soon"></p></div>
        <div class="card"><h3 data-i18n="g3"></h3><p class="soon" data-i18n="soon"></p></div>
        <div class="card"><h3 data-i18n="g4"></h3><p class="soon" data-i18n="soon"></p></div>
        <div class="card"><h3 data-i18n="g5"></h3><p class="soon" data-i18n="soon"></p></div>
      </div>
    </section>

    <section id="v-subs" class="view">
      <h1 data-i18n="subs_title"></h1>
      <p class="sub" data-i18n="subs_text"></p>
      <div class="card"><p class="soon" data-i18n="soon"></p></div>
    </section>

    <section id="v-legal" class="view">
      <h1 data-i18n="legal_title"></h1>
      <p class="sub" data-i18n="legal_sub"></p>
      <div class="card"><p class="soon" data-i18n="soon"></p></div>
    </section>
  </main>

  <aside class="rail" id="rail-right"></aside>
</div>

<section class="tgband">
  <div class="tgbox">
    <div>
      <h3 data-i18n="tg_title"></h3>
      <p data-i18n="tg_text"></p>
    </div>
    <div class="btns">
      <a class="btn" data-tg="es" id="tg-es"></a>
      <a class="btn" data-tg="en" id="tg-en"></a>
    </div>
  </div>
</section>

<section class="bottom">
  <div class="mix" id="bottom-mix"></div>
</section>

<footer>
  <div>© <span id="year"></span> Community16 LLC · LotoLab</div>
  <div data-i18n="foot_play"></div>
  <div id="rev"></div>
</footer>

function fmt(s, vars) {
  return s.replace(/\{(\w+)\}/g, function (m, k) { return vars[k] !== undefined ? vars[k] : m; });
}
function esc(s) {
  return String(s).replace(/[&<>"]/g, function (c) {
    return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c];
  });
}
function pad(n) { return n < 10 ? "0" + n : "" + n; }
function loc(lang) { return lang === "es" ? "es-ES" : "en-US"; }
function fmtNum(n, lang) { return Number(n).toLocaleString(loc(lang)); }
function fmtPct(x, lang) {
  return Number(x).toLocaleString(loc(lang), { minimumFractionDigits: 1, maximumFractionDigits: 2 }) + "%";
}
function fmtDate(iso, lang) {
  var p = iso.split("-");
  var d = new Date(+p[0], +p[1] - 1, +p[2]);
  return d.toLocaleDateString(loc(lang), { day: "numeric", month: "short", year: "numeric" });
}
function balls(main, bonus, hits, bonusHit) {
  var h = "", i;
  for (i = 0; i < main.length; i++) {
    var isHit = hits && hits.indexOf(main[i]) >= 0;
    h += '<span class="ball' + (isHit ? ' hit' : '') + '">' + pad(main[i]) + '</span>';
  }
  if (bonus !== null && bonus !== undefined) {
    h += '<span class="ball b' + (bonusHit ? ' hit' : '') + '">' + pad(bonus) + '</span>';
  }
  return h;
}
function rowHtml(label, widthPct, valText, markPct) {
  var w = Math.max(0, Math.min(100, widthPct));
  var m = (markPct === null || markPct === undefined) ? "" :
    '<div class="mark" style="left:' + Math.max(0, Math.min(100, markPct)).toFixed(1) + '%"></div>';
  return '<div class="row">' + label +
    '<div class="track"><div class="fill" style="width:' + w.toFixed(1) + '%"></div>' + m + '</div>' +
    '<span class="val">' + valText + '</span></div>';
}
function numLabel(n) { return '<span class="n">' + pad(n) + '</span>'; }
function textLabel(s) { return '<span class="lab">' + s + '</span>'; }

function topBy(rows, key, k) {
  var c = rows.slice();
  c.sort(function (a, b) { return (b[key] - a[key]) || (a.n - b.n); });
  return c.slice(0, k);
}
function freqBars(block, k, lang) {
  var top = topBy(block.numbers, "count", k);
  var exp = block.expected_pct_draws;
  var scale = Math.max(exp * 1.5, top.length ? top[0].pct_draws * 1.1 : 1);
  var h = "";
  for (var i = 0; i < top.length; i++) {
    var r = top[i];
    h += rowHtml(numLabel(r.n), r.pct_draws / scale * 100,
      fmtPct(r.pct_draws, lang) + " (" + fmtNum(r.count, lang) + ")", exp / scale * 100);
  }
  return h;
}
function delayBars(block, k, lang, t) {
  var top = topBy(block.numbers, "delay", k);
  var scale = top.length && top[0].delay > 0 ? top[0].delay * 1.05 : 1;
  var h = "";
  for (var i = 0; i < top.length; i++) {
    var r = top[i];
    h += rowHtml(numLabel(r.n), r.delay / scale * 100, fmtNum(r.delay, lang) + " " + t.draws_unit, null);
  }
  return h;
}
function profileBars(list, labelFn, lang) {
  var mx = 1, i;
  for (i = 0; i < list.length; i++) if (list[i].pct > mx) mx = list[i].pct;
  var h = "";
  for (i = 0; i < list.length; i++) {
    h += rowHtml(textLabel(labelFn(list[i])), list[i].pct / mx * 100, fmtPct(list[i].pct, lang), null);
  }
  return h;
}

  return fmt(t.ago_d, { d: Math.floor(h / 24) });
}

function shuffled(list, rnd) {
  var a = list.slice(), i, j, tmp;
  for (i = a.length - 1; i > 0; i--) {
    j = Math.floor(rnd() * (i + 1));
    tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}
// Mezcla al azar: dos noticias por cada anuncio, siempre entremezclados.
function mixFeed(news, ads, rnd) {
  var n = shuffled(news, rnd), a = shuffled(ads, rnd), out = [], ni = 0, ai = 0;
  while (ni < n.length || ai < a.length) {
    var k;
    for (k = 0; k < 2 && ni < n.length; k++) out.push({ k: "n", v: n[ni++] });
    if (ai < a.length) out.push({ k: "a", v: a[ai++] });
    else if (ni >= n.length) break;
  }
  return out;
}
function feedItemHtml(it, lang, nowMs) {
  return it.k === "n" ? newsCardHtml(it.v, lang, nowMs) : adCardHtml(it.v, lang);
}
function feedHtml(items, lang, nowMs) {
  var h = "";
  for (var i = 0; i < items.length; i++) h += feedItemHtml(items[i], lang, nowMs);
  return h;
}
function splitSides(items, perSide) {
  var l = [], r = [];
  for (var i = 0; i < items.length; i++) {
    if (l.length >= perSide && r.length >= perSide) break;
    if (i % 2 === 0) { if (l.length < perSide) l.push(items[i]); }
    else if (r.length < perSide) r.push(items[i]);
  }
  return { left: l, right: r };
}

/* ---------- Comprobador de números ---------- */
// Gana con 3 o mas numeros, o con la bola extra aunque no se acierte ningun numero
// (regla comun a Powerball y Mega Millions). Orden de menor a mayor premio.
function tierRank(m, b) {
  if (m === 5) return b ? 9 : 8;
  if (m === 4) return b ? 7 : 6;
  if (m === 3) return b ? 5 : 4;
  if (m === 2 && b) return 3;
  if (m === 1 && b) return 2;
  if (m === 0 && b) return 1;
  return 0;
}
function compareDraw(picks, bonus, draw) {
  var hits = [], i;
  for (i = 0; i < draw[1].length; i++) if (picks.indexOf(draw[1][i]) >= 0) hits.push(draw[1][i]);
  var bHit = draw[2] === bonus;
  return { hits: hits, m: hits.length, b: bHit, rank: tierRank(hits.length, bHit) };
}
function validatePicks(j, vals, bonusVal, lang) {
  var t = T[lang], i, seen = {};
  if (vals.length !== j.rules.main_count) return t.ck_err_empty;
  for (i = 0; i < vals.length; i++) {
    if (vals[i] === null || bonusVal === null) return t.ck_err_empty;
  }
  for (i = 0; i < vals.length; i++) {
    if (vals[i] < 1 || vals[i] > j.rules.main_max) return fmt(t.ck_err_range, { max: j.rules.main_max });
    if (seen[vals[i]]) return t.ck_err_dup;
    seen[vals[i]] = true;
  }
  if (bonusVal < 1 || bonusVal > j.rules.bonus_max) return fmt(t.ck_err_bonus, { b: j.rules.bonus_name, max: j.rules.bonus_max });
  return null;
}
function tierText(j, m, b, lang) {
  var t = T[lang];
  return fmt(b ? t.ck_tier_b : t.ck_tier, { m: m, k: j.rules.main_count, b: esc(j.rules.bonus_name) });
}
function checkHtml(j, picks, bonus, drawIdx, lang) {
  var t = T[lang], h = "";
  var draw = j.draws[drawIdx];
  var r = compareDraw(picks, bonus, draw);
  var win = r.rank > 0;
  h += '<div class="card result' + (win ? ' win' : '') + '"><h3>' + (win ? t.ck_hit : t.ck_miss) + '</h3>';
  h += '<p>' + fmt(t.ck_result, { tier: tierText(j, r.m, r.b, lang) }) + '</p>';
  if (win) h += '<p class="note">' + t.ck_prize_note + '</p>';
  h += '<h3 style="font-size:1rem">' + t.ck_draw_nums + ' · ' + fmtDate(draw[0], lang) + '</h3>' +
    '<div>' + balls(draw[1], draw[2], r.hits, r.b) + '</div></div>';

  var n = j.draws.length, prized = 0, best = { rank: -1, m: 0, b: false, date: "" }, i;
  for (i = 0; i < n; i++) {
    var c = compareDraw(picks, bonus, j.draws[i]);
    if (c.rank > 0) prized++;
    if (c.rank > best.rank || (c.rank === best.rank && j.draws[i][0] > best.date)) {
      best = { rank: c.rank, m: c.m, b: c.b, date: j.draws[i][0] };
    }
  }
  h += '<div class="card" style="margin-top:14px"><h3 style="margin-top:0">' + t.ck_hist_title + '</h3><p>' +
    fmt(prized > 0 ? t.ck_hist_text : t.ck_hist_none, {
      n: fmtNum(n, lang), p: fmtNum(prized, lang), best: tierText(j, best.m, best.b, lang), date: fmtDate(best.date, lang) }) +
    '</p><p class="note">' + t.ck_hist_note + '</p></div>';
  return h;
}
// ==PURE-END==

var DATA = {};
var INDEX = null;
var NEWS = null;
var REV = null;
var loadState = "loading";
var lang = "es";
var view = "home";
var currentLot = null;

function ids() {
  var out = [], i;
  if (!INDEX) return out;
  for (i = 0; i < INDEX.lotteries.length; i++) out.push(INDEX.lotteries[i].id);
  return out;
}
function loadedList() {
  var l = ids(), out = [];
  for (var i = 0; i < l.length; i++) if (DATA[l[i]]) out.push(DATA[l[i]]);
  return out;
}
function newsList(kind) {
  return (NEWS && NEWS[lang] && NEWS[lang][kind]) ? NEWS[lang][kind] : [];
}

function renderCountry(c) {
  var el = document.getElementById("list-" + c);
  if (loadState === "loading") { el.innerHTML = '<p class="loading">' + T[lang].loading + '</p>'; return; }
  if (loadState === "error") { el.innerHTML = '<p class="loading">' + T[lang].load_error + '</p>'; return; }
  var h = "";
  for (var i = 0; i < CATALOG[c].length; i++) {
    var item = CATALOG[c][i];
    h += DATA[item.id] ? cardHtml(DATA[item.id], lang) : soonCardHtml(item, c, lang);
  }
  el.innerHTML = h;
}

function renderHome() {
  var el = document.getElementById("home-latest"), st = document.getElementById("home-stats");
  if (loadState === "loading") { el.innerHTML = '<p class="loading">' + T[lang].loading + '</p>'; st.innerHTML = ""; return; }
  if (loadState === "error") { el.innerHTML = '<p class="loading">' + T[lang].load_error + '</p>'; st.innerHTML = ""; return; }
  var list = loadedList(), h = "";
  for (var i = 0; i < list.length; i++) h += cardHtml(list[i], lang);
  el.innerHTML = h;
  st.innerHTML = statsHtml(list, lang);
}

function renderLot() {
  var el = document.getElementById("lot-body");
  if (currentLot && DATA[currentLot]) el.innerHTML = detailHtml(DATA[currentLot], lang);
}

// Noticias + publicidad entremezcladas al azar (laterales, abajo, portada, noticias, premiados)
function renderFeeds() {
  var now = Date.now(), ads = SITES.slice(), nw = newsList("news"), wn = newsList("winners");
  var sides = splitSides(mixFeed(nw.concat(wn), ads, Math.random), 10);
  document.getElementById("rail-left").innerHTML = feedHtml(sides.left, lang, now);
  document.getElementById("rail-right").innerHTML = feedHtml(sides.right, lang, now);
  document.getElementById("bottom-mix").innerHTML = feedHtml(mixFeed(nw.concat(wn), ads, Math.random).slice(0, 6), lang, now);
  document.getElementById("home-news").innerHTML = feedHtml(mixFeed(nw, ads.slice(0, 2), Math.random).slice(0, 8), lang, now);
  var t = T[lang], nl = document.getElementById("news-list"), wl = document.getElementById("winners-list");
  nl.innerHTML = nw.length ? feedHtml(mixFeed(nw, ads.slice(0, 3), Math.random), lang, now) : '<div class="card"><p>' + t.news_empty + '</p></div>';
  wl.innerHTML = wn.length ? feedHtml(mixFeed(wn, ads.slice(0, 3), Math.random), lang, now) : '<div class="card"><p>' + t.winners_empty + '</p></div>';
}

function renderRev() {
  var el = document.getElementById("rev");
  if (!REV || !REV.checked_utc) { el.textContent = ""; return; }
  var d = fmtDate(REV.checked_utc.slice(0, 10), lang);
  el.textContent = fmt(REV.ok && !(REV.warnings && REV.warnings.length) ? T[lang].rev_ok : T[lang].rev_warn, { d: d });
}

function renderTelegram() {
  var els = document.querySelectorAll("[data-tg]");
  for (var i = 0; i < els.length; i++) {
    var a = els[i], key = a.getAttribute("data-tg"), t = T[lang];
    var k = key === "auto" ? lang : key;
    var url = TELEGRAM[k];
    var okLabel = key === "auto" ? t.tg_join : (k === "es" ? t.tg_es : t.tg_en);
    var soonLabel = key === "auto" ? t.tg_soon : (k === "es" ? t.tg_es_soon : t.tg_en_soon);
    if (url) {
      a.setAttribute("href", url); a.setAttribute("target", "_blank"); a.setAttribute("rel", "noopener");
      a.className = a.className.replace(/\s*disabled/g, "");
      a.textContent = "✈ " + okLabel;
    } else {
      a.removeAttribute("href");
      if (a.className.indexOf("disabled") < 0) a.className += " disabled";
      a.textContent = "✈ " + soonLabel;
    }
  }
}

/* Comprobador: formulario */
var ckLot = null;
function renderCheckForm() {
  var el = document.getElementById("ck-form"), t = T[lang], list = loadedList();
  if (loadState !== "ok" || !list.length) { el.innerHTML = '<p class="loading">' + (loadState === "loading" ? t.loading : t.ck_none) + '</p>'; return; }
  if (!ckLot || !DATA[ckLot]) ckLot = list[0].lottery;
  var j = DATA[ckLot], i, h = "";
  h += '<label for="ck-lot">' + t.ck_lot + '</label><select id="ck-lot">';
  for (i = 0; i < list.length; i++) h += '<option value="' + esc(list[i].lottery) + '"' + (list[i].lottery === ckLot ? " selected" : "") + '>' + esc(list[i].name) + '</option>';
  h += '</select><label for="ck-draw">' + t.ck_draw + '</label><select id="ck-draw">';
  var shown = 0;
  for (i = j.draws.length - 1; i >= 0 && shown < 40; i--, shown++) {
    h += '<option value="' + i + '">' + fmtDate(j.draws[i][0], lang) + '</option>';
  }
  h += '</select><label>' + t.ck_nums + ' (' + esc(j.name) + ')</label><div class="nums" id="ck-nums">';
  for (i = 0; i < j.rules.main_count; i++) h += '<input type="number" inputmode="numeric" min="1" max="' + j.rules.main_max + '" class="ck-n" aria-label="' + (i + 1) + '">';
  h += '<input type="number" inputmode="numeric" min="1" max="' + j.rules.bonus_max + '" class="bonus" id="ck-b" placeholder="' + esc(j.rules.bonus_name) + '" aria-label="' + esc(j.rules.bonus_name) + '">';
  h += '</div><p style="margin-top:16px"><button class="btn" id="ck-go">' + t.ck_go + '</button></p><div id="ck-err" class="warn" style="display:none"></div>' +
    '<p class="note">' + t.ck_soon + '</p>';
  el.innerHTML = h;
  document.getElementById("ck-lot").onchange = function () { ckLot = this.value; document.getElementById("ck-result").innerHTML = ""; renderCheckForm(); };
  document.getElementById("ck-go").onclick = runCheck;
}
function readNum(el) {
  var v = el.value.trim();
  if (v === "") return null;
  var n = Number(v);
  return (isFinite(n) && Math.floor(n) === n) ? n : NaN;
}
function runCheck() {
  var j = DATA[ckLot], inputs = document.querySelectorAll(".ck-n"), vals = [], i;
  for (i = 0; i < inputs.length; i++) vals.push(readNum(inputs[i]));
  var bonus = readNum(document.getElementById("ck-b"));
  for (i = 0; i < vals.length; i++) if (vals[i] !== null && isNaN(vals[i])) vals[i] = 0;
  if (bonus !== null && isNaN(bonus)) bonus = 0;
  var err = validatePicks(j, vals, bonus, lang), box = document.getElementById("ck-err"), out = document.getElementById("ck-result");
  if (err) { box.style.display = "block"; box.textContent = err; out.innerHTML = ""; return; }
  box.style.display = "none";
  out.innerHTML = checkHtml(j, vals, bonus, Number(document.getElementById("ck-draw").value), lang);
}

function renderTheme() {
  var th = document.documentElement.getAttribute("data-theme");
  document.getElementById("theme-btn").textContent = th === "dark" ? "☀️" : "🌙";
}
function setTheme(th) {
  document.documentElement.setAttribute("data-theme", th);
  try { localStorage.setItem("lotolab_theme", th); } catch (e) {}
  renderTheme();
}

function applyText() {
  var els = document.querySelectorAll("[data-i18n]");
  for (var i = 0; i < els.length; i++) {
    els[i].innerHTML = T[lang][els[i].getAttribute("data-i18n")];
  }
  document.documentElement.lang = lang;
  document.getElementById("btn-es").className = lang === "es" ? "on" : "";
  document.getElementById("btn-en").className = lang === "en" ? "on" : "";
  renderHome(); renderCountry("es"); renderCountry("us"); renderLot();
  renderFeeds(); renderTelegram(); renderCheckForm(); renderRev();
  var res = document.getElementById("ck-result");
  if (res) res.innerHTML = "";
}

function setLang(l) {
  lang = l;
  try { localStorage.setItem("lotolab_lang", l); } catch (e) {}
  applyText();
}

function show(v) {
  view = v;
  var views = document.querySelectorAll(".view");
  for (var i = 0; i < views.length; i++) views[i].className = "view";
  document.getElementById("v-" + v).className = "view on";
  var navView = v;
  if (v === "lot" && currentLot && DATA[currentLot]) navView = DATA[currentLot].country;
  var btns = document.querySelectorAll(".menu button");
  for (var j = 0; j < btns.length; j++) {
    btns[j].className = btns[j].getAttribute("data-view") === navView ? "on" : "";
  }
  window.scrollTo(0, 0);
}

function showLot(id) {
  currentLot = id;
  renderLot();
  show("lot");
}

function fetchJson(path) {
  var v = "?v=" + Math.floor(Date.now() / 600000);
  return fetch(path + v).then(function (r) {
    if (!r.ok) throw new Error(path);
    return r.json();
  });
}

function loadData() {
  fetchJson("data/index.json").then(function (idx) {
    INDEX = idx;
    return Promise.all(idx.lotteries.map(function (it) {
      return fetchJson("data/" + it.file).then(function (j) { DATA[it.id] = j; });
    }));
  }).then(function () {
    loadState = "ok";
    applyText();
  }).catch(function () {
    loadState = "error";
    applyText();
  });
}
function loadNews() {
  fetchJson("data/news.json").then(function (n) { NEWS = n; renderFeeds(); }).catch(function () {});
}
function loadRev() {
  fetchJson("data/revision.json").then(function (r) { REV = r; renderRev(); }).catch(function () {});
}

(function init() {
  var th = "light";
  try {
    var savedTheme = localStorage.getItem("lotolab_theme");
    if (savedTheme === "light" || savedTheme === "dark") th = savedTheme;
    else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) th = "dark";
  } catch (e) {}
  document.documentElement.setAttribute("data-theme", th);
  try {
    var saved = localStorage.getItem("lotolab_lang");
    if (saved === "es" || saved === "en") lang = saved;
    else if ((navigator.language || "").slice(0, 2) === "en") lang = "en";
  } catch (e) {}
  document.addEventListener("click", function (ev) {
    var t = ev.target;
    var lot = t.closest ? t.closest("[data-lot]") : null;
    if (lot) { showLot(lot.getAttribute("data-lot")); return; }
    var vw = t.closest ? t.closest("[data-view]") : null;
    if (vw) show(vw.getAttribute("data-view"));
  });
  document.getElementById("theme-btn").onclick = function () {
    setTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark");
  };
  document.getElementById("lot-back").onclick = function () {
    show(currentLot && DATA[currentLot] ? DATA[currentLot].country : "home");
  };
  document.getElementById("year").textContent = new Date().getFullYear();
  renderTheme();
  applyText();
  show("home");
  loadData();
  loadNews();
  loadRev();
  setInterval(loadNews, 30 * 60 * 1000);   // si la pagina sigue abierta, refresca noticias y publicidad
})();
</script>
